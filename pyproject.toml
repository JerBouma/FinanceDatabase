[project]
name = "financedatabase"
version = "2.4.0"
description = "This is a database of 300.000+ symbols containing Equities, ETFs, Funds, Indices, Currencies, Cryptocurrencies and Money Markets."
license = {text = "MIT"}
authors = [
    { name = "Jeroen Bouma" }
]
readme = "README.md"
homepage = "https://www.jeroenbouma.com/"
repository = "https://github.com/JerBouma/FinanceDatabase"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "Finance",
    "Database",
    "Equities",
    "ETFs",
    "Funds",
    "Indices",
    "Currencies",
    "Cryptocurrencies",
    "Money Markets",
]
requires-python = ">=3.10, <3.16"
dependencies = [
    "financetoolkit>=2.0.3,<3.0.0",
    "polars>=1.20",
]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.27.0,<2",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
financedatabase-mcp = "financedatabase.mcp_server.mcp_controller:main"
financedatabase-mcp-inspector = "financedatabase.mcp_server.mcp_controller:run_inspector"
financedatabase-mcp-setup = "financedatabase.mcp_server.mcp_controller:run_setup"

[tool.mcp]
mcp-name = "io.github.JerBouma/financedatabase"

[dependency-groups]
dev = [
    # The MCP server is tested in CI, which installs the dev group only.
    "financedatabase[mcp]",
    "pytest>=8.3",
    "ipykernel>=6.29",
    "black[jupyter]>=25.1",
    "codespell>=2.3",
    "pytest-mock>=3.14",
    "pytest-recording>=0.13",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "pytest-timeout>=2.3",
    "tqdm>=4.67",
    "python-stdnum>=2.2",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["financedatabase"]
exclude = ["financedatabase/validation"]

[tool.hatch.build.targets.sdist]
include = [
    "financedatabase/**",
]
exclude = [
    "financedatabase/validation",
]

[tool.black]
target-version = ["py313"]

[tool.ruff]
line-length = 122
lint.select = [
    "E",   # E: pycodestyle error checks (style errors)
    "W",   # W: pycodestyle warning checks (style warnings)
    "F",   # F: pyflakes checks (possible logic errors, undefined names)
    "Q",   # Q: quote-related checks (enforce consistent quoting rules)
    "S",   # S: security-related checks (bandit-style security rules)
    "UP",  # UP: pyupgrade / modernization fixers and related rules
    "I",   # I: import-related checks (ordering, unused imports)
    "PD",  # PD: pandas-vet checks (pandas usage patterns)
    "SIM", # SIM: simplification suggestions (refactoring hints)
    "PLC", # PLC: pylint conventions
    "PLE", # PLE: pylint errors
    "PLR", # PLR: pylint refactoring suggestions
    "PLW", # PLW: pylint warnings
]

lint.ignore = [
    "S105",  # Bandit: possible hardcoded password assigned to a variable
    "S106",  # Bandit: possible hardcoded password passed as an argument
    "S107",  # Bandit: possible hardcoded password as a default argument
    "PLR0913",  # Pylint-refactor: too many arguments in function/method
    "PLR0917",  # Pylint-refactor: too many positional arguments in function/method
    "PLR0912",  # Pylint-refactor: too many branches in function/method
    "PLR0911",  # Pylint-refactor: too many return statements in function/method
    "PLR0915",  # Pylint-refactor: too many statements in function/method
    "PD010",  # pandas-vet: .pivot_table preferred over .pivot or .unstack
    "PD013",  # pandas-vet: .melt preferred over .stack
    "S310",  # Bandit: URL open for permitted schemes
    "S301",  # Bandit: pickle usage
    "S101",  # Bandit: use of assert (assert removed in optimized runs)
    "PLR2004",  # Pylint-refactor: magic value used in comparison
]

exclude = ["conftest.py", "examples", "compression"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.lint.isort]
profile = "black"
line_length = 122
skip_gitignore = true
combine_as_imports = true

[tool.codespell]
ignore-words-list = 'berkley,Sie,VIE,ore,HANSOME,Worchester,OIS'
skip = '*.json,./.git,pyproject.toml,uv.lock,examples,*.csv'

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning:",
]
testpaths = ["tests"]
addopts = "--strict-markers"
