name: Database Update

on:
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 12 * * SUN'

jobs:
  Add-New-Ticker:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v6
      - name: pull changes
        run: git pull https://${{secrets.PAT}}@github.com/JerBouma/FinanceDatabase.git main
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install "pandas[excel]"
      - name: Add classified US equity tickers
        run: |
          python financedatabase/validation/update_us_equities.py \
            --apply \
            --report /tmp/us-equity-import-report.csv
      - name: Upload US equity import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-equity-import-report
          path: /tmp/us-equity-import-report.csv
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit files and log
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add -A
          git checkout main
          git diff-index --quiet HEAD || git commit -am "Update database with new tickers"
          git push
  Update-Compression-Files:
    needs: Add-New-Ticker
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v6
      - name: pull changes
        run: git pull https://${{secrets.PAT}}@github.com/JerBouma/FinanceDatabase.git main
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install "pandas[excel]" financedatabase
      - name: Update Compressions
        uses: jannekem/run-python-script-action@v1.8
        with:
          script: |
            import glob
            import financedatabase as fd
            import pandas as pd

            # Read every column as text and keep NA-like strings intact, so the
            # compressed datasets match the source CSVs cell for cell: no "9763.0"
            # in place of "9763", and no null symbol for the ticker "NA".
            read = dict(dtype=str, keep_default_na=False)

            cryptos = pd.read_csv('database/cryptos.csv', **read)
            cryptos = cryptos.sort_values(cryptos.columns[0]).reset_index(drop=True)
            cryptos.to_csv('compression/cryptos.bz2', index=False, compression='bz2')

            currencies = pd.read_csv('database/currencies.csv', **read)
            currencies = currencies.sort_values(currencies.columns[0]).reset_index(drop=True)
            currencies.to_csv('compression/currencies.bz2', index=False, compression='bz2')

            equities = pd.concat([pd.read_csv(f, **read) for f in sorted(glob.glob('database/equities/*.csv'))], ignore_index=True)
            equities = equities.sort_values(equities.columns[0]).reset_index(drop=True)
            equities.to_csv('compression/equities.bz2', index=False, compression='bz2')

            etfs = pd.concat([pd.read_csv(f, **read) for f in sorted(glob.glob('database/etfs/*.csv'))], ignore_index=True)
            etfs = etfs.sort_values(etfs.columns[0]).reset_index(drop=True)
            etfs.to_csv('compression/etfs.bz2', index=False, compression='bz2')

            funds = pd.concat([pd.read_csv(f, **read) for f in sorted(glob.glob('database/funds/*.csv'))], ignore_index=True)
            funds = funds.sort_values(funds.columns[0]).reset_index(drop=True)
            funds.to_csv('compression/funds.bz2', index=False, compression='bz2')

            indices = pd.read_csv('database/indices.csv', **read)
            indices = indices.sort_values(indices.columns[0]).reset_index(drop=True)
            indices.to_csv('compression/indices.bz2', index=False, compression='bz2')

            moneymarkets = pd.read_csv('database/moneymarkets.csv', **read)
            moneymarkets = moneymarkets.sort_values(moneymarkets.columns[0]).reset_index(drop=True)
            moneymarkets.to_csv('compression/moneymarkets.bz2', index=False, compression='bz2')
      - name: Commit files and log
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add -A
          git checkout main
          git diff-index --quiet HEAD || git commit -am "Update Compression Files"
          git push
      - name: Check run status
        if: steps.run.outputs.status != '0'
        run: exit "${{ steps.run.outputs.status }}"

  Update-Categorization-Files:
      needs:  [Add-New-Ticker, Update-Compression-Files]
      runs-on: ubuntu-latest
      steps:
        - name: checkout repo content
          uses: actions/checkout@v6
        - name: pull changes
          run: git pull https://${{secrets.PAT}}@github.com/JerBouma/FinanceDatabase.git main
        - name: setup python
          uses: actions/setup-python@v6
          with:
            python-version: '3.10'
        - run: pip install "pandas[excel]" financedatabase
        - name: Update categories
          uses: jannekem/run-python-script-action@v1.8
          with:
            script: |
              import glob
              import financedatabase as fd
              import pandas as pd

              # dtype=str keeps numeric-looking fields (zipcode, cusip) as text, so
              # the generated option lists hold "9763" rather than "9763.0".
              # A fixed mtime keeps the gzip artifacts byte-identical when their
              # uncompressed content has not changed.
              gzip = {'method': 'gzip', 'mtime': 0}

              cryptos = pd.read_csv("database/cryptos.csv", index_col=0, dtype=str)
              cryptos_categories = {}
              for column in cryptos:
                  if column in ['name', 'summary']:
                      continue
                      
                  cryptos_categories[column] = sorted(cryptos[column].dropna().unique(), key=str)
                  
              df_temp = pd.DataFrame.from_dict(cryptos_categories, orient='index').reset_index()
              df_temp.to_csv('compression/categories/cryptos_categories.gzip', index=False, compression=gzip)
                  
              currencies = pd.read_csv("database/currencies.csv", index_col=0, dtype=str)
              currencies_categories = {}
              for column in currencies:
                  if column in ['name']:
                      continue

                  currencies_categories[column] = sorted(currencies[column].dropna().unique(), key=str)

              df_temp = pd.DataFrame.from_dict(currencies_categories, orient='index').reset_index()
              df_temp.to_csv('compression/categories/currencies_categories.gzip', index=False, compression=gzip)
                  
              equities = pd.concat([pd.read_csv(f, index_col=0, dtype=str) for f in sorted(glob.glob('database/equities/*.csv'))])
              equities_categories = {}
              for column in equities:
                  if column in ['name', 'summary', 'website', 'delisted']:
                      continue
                      
                  equities_categories[column] = sorted(equities[column].dropna().unique(), key=str)
                  
              df_temp = pd.DataFrame.from_dict(equities_categories, orient='index').reset_index()
              df_temp.to_csv('compression/categories/equities_categories.gzip', index=False, compression=gzip)
                  
              etfs = pd.concat([pd.read_csv(f, index_col=0, dtype=str) for f in sorted(glob.glob('database/etfs/*.csv'))])
              etfs_categories = {}
              for column in etfs:
                  if column in ['name', 'summary']:
                      continue
                      
                  etfs_categories[column] = sorted(etfs[column].dropna().unique(), key=str)

              df_temp = pd.DataFrame.from_dict(etfs_categories, orient='index').reset_index()
              df_temp.to_csv('compression/categories/etfs_categories.gzip', index=False, compression=gzip)
                  
              funds = pd.concat([pd.read_csv(f, index_col=0, dtype=str) for f in sorted(glob.glob('database/funds/*.csv'))])
              funds_categories = {}
              for column in funds:
                  if column in ['name', 'summary', 'manager_name', 'manager_bio']:
                      continue
                      
                  funds_categories[column] = sorted(funds[column].dropna().unique(), key=str)
                  
              df_temp = pd.DataFrame.from_dict(funds_categories, orient='index').reset_index()
              df_temp.to_csv('compression/categories/funds_categories.gzip', index=False, compression=gzip)
                  
              indices = pd.read_csv("database/indices.csv", index_col=0, dtype=str)
              indices_categories = {}
              for column in indices:
                  if column in ['name']:
                      continue
                      
                  indices_categories[column] = sorted(indices[column].dropna().unique(), key=str)
                  
              df_temp = pd.DataFrame.from_dict(indices_categories, orient='index').reset_index()
              df_temp.to_csv('compression/categories/indices_categories.gzip', index=False, compression=gzip)
                  
              moneymarkets = pd.read_csv("database/moneymarkets.csv", index_col=0, dtype=str)
              moneymarkets_categories = {}
              for column in moneymarkets:
                  if column in ['name']:
                      continue
                      
                  moneymarkets_categories[column] = sorted(moneymarkets[column].dropna().unique(), key=str)
                  
              df_temp = pd.DataFrame.from_dict(moneymarkets_categories, orient='index').reset_index()
              df_temp.to_csv('compression/categories/moneymarkets_categories.gzip', index=False, compression=gzip)

        - name: Commit files and log
          run: |
            git config --global user.name 'GitHub Action'
            git config --global user.email 'action@github.com'
            git add -A
            git checkout main
            git diff-index --quiet HEAD || git commit -am "Update Categorization Files"
            git push
        - name: Check run status
          if: steps.run.outputs.status != '0'
          run: exit "${{ steps.run.outputs.status }}"

  Update-README-Statistics:
    needs: [Add-New-Ticker, Update-Compression-Files, Update-Categorization-Files]
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v6
      - name: pull changes
        run: git pull https://${{secrets.PAT}}@github.com/JerBouma/FinanceDatabase.git main
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pandas
      - name: Refresh the statistics tables in README.md
        uses: jannekem/run-python-script-action@v1.8
        with:
          script: |
            import glob
            import re
            from pathlib import Path
            import pandas as pd

            def _n(x: int) -> str:
                """Format an integer with a thousand-separator dot (e.g. 160.113)."""
                return f"{x:,}".replace(",", ".")

            # Table A: Equities — Quantity, Sectors, Industries, Countries, Exchanges
            eq = pd.concat([pd.read_csv(f, dtype=str) for f in sorted(glob.glob('database/equities/*.csv'))], ignore_index=True)
            table_a_row = (
                "Equities",
                _n(len(eq)),
                _n(eq["sector"].nunique()),
                _n(eq["industry"].nunique()),
                _n(eq["country"].nunique()),
                _n(eq["exchange"].nunique()),
            )

            # Table B: ETFs / Funds — Quantity, Families, Categories, Exchanges
            # (no Countries column: ETF/Fund 'country' is semantically the investment
            # scope, not a HQ — not derivable from listing exchange alone.)
            table_b_rows = []
            for asset in ("ETFs", "Funds"):
                df = pd.concat([pd.read_csv(f, dtype=str) for f in sorted(glob.glob(f'database/{asset.lower()}/*.csv'))], ignore_index=True)
                table_b_rows.append((
                    asset,
                    _n(len(df)),
                    _n(df["family"].nunique()),
                    _n(df["category"].nunique()),
                    _n(df["exchange"].nunique()),
                ))

            # Table C: Currencies / Cryptocurrencies / Indices / Money Markets
            table_c_rows = []
            for asset, fname, col, label in [
                ("Currencies",       "currencies.csv",   "quote_currency", "Currencies"),
                ("Cryptocurrencies", "cryptos.csv",      "cryptocurrency", "Cryptocurrencies"),
                ("Indices",          "indices.csv",      "exchange",       "Exchanges"),
                ("Money Markets",    "moneymarkets.csv", "exchange",       "Exchanges"),
            ]:
                df = pd.read_csv(f"database/{fname}", dtype=str)
                table_c_rows.append((asset, _n(len(df)), f"{_n(df[col].nunique())} {label}"))

            def _fmt_table_a(row):
                h = "| Product           | Quantity   | Sectors    | Industries    | Countries | Exchanges |\n"
                h += "| ----------------- | ---------- | ---------- | ------------- | --------- | --------- |"
                a, q, s, i, c, e = row
                b = f"| {a:<17} | {q:<10} | {s:<10} | {i:<13} | {c:<9} | {e:<9} |"
                return h + "\n" + b

            def _fmt_table_b(rows):
                h = "| Product           | Quantity   | Families   | Categories    | Exchanges |\n"
                h += "| ----------------- | ---------- | ---------- | ------------- | --------- |"
                b = "\n".join(
                    f"| {a:<17} | {q:<10} | {f:<10} | {c:<13} | {e:<9} |"
                    for (a, q, f, c, e) in rows
                )
                return h + "\n" + b

            def _fmt_table_c(rows):
                h = "| Product           | Quantity  | Category              |\n"
                h += "| ----------------- | --------- | --------------------- |"
                b = "\n".join(
                    f"| {a:<17} | {q:<9} | {c:<21} |"
                    for (a, q, c) in rows
                )
                return h + "\n" + b

            readme = Path("README.md")
            text = readme.read_text(encoding="utf-8")
            # Refresh the Equities (A) and ETFs/Funds (B) statistics tables.
            text = re.sub(
                r"\| Product\s+\| Quantity\s+\| Sectors[^\n]*\| Industries[^\n]*\n"
                r"\|[^\n]*\n\|[^\n]*\n\n"
                r"\| Product\s+\| Quantity\s+\| Families[^\n]*\n\|[^\n]*\n(?:\|[^\n]*\n){2}",
                _fmt_table_a(table_a_row) + "\n\n" + _fmt_table_b(table_b_rows) + "\n",
                text,
                count=1,
            )
            text = re.sub(
                r"\| Product\s+\| Quantity\s+\| Category[^\n]*\n\|[^\n]*\n(?:\|[^\n]*\n){4}",
                _fmt_table_c(table_c_rows) + "\n",
                text,
                count=1,
            )
            readme.write_text(text, encoding="utf-8")
            print("README.md statistics tables refreshed.")
      - name: Commit README update
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add README.md
          git diff-index --quiet HEAD || git commit -m "Update README statistics"
          git push

  Check-GICS-Categorisation:
    needs:  [Add-New-Ticker, Update-Compression-Files, Update-Categorization-Files, Update-README-Statistics]
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v6
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install "pandas[excel]" financedatabase
      - name: Check GICS Categorisation
        uses: jannekem/run-python-script-action@v1.8
        with:
          script: |
            import glob
            import pandas as pd
            import json

            invalid_rows = pd.DataFrame()
            errors = []
            gics = json.load(open("compression/categories/categories.json", "r"))
            equities = pd.concat([pd.read_csv(f, index_col=0) for f in sorted(glob.glob('database/equities/*.csv'))])
            filtered_data = equities[equities['sector'].notna() & equities['industry_group'].notna() & equities['industry'].notna()]

            for index, row in filtered_data.iterrows():
                sector, industry_group, industry = row['sector'], row['industry_group'], row['industry']

                try:
                    # Search whether it can find the combination
                    gics[sector][industry_group][industry]
                except KeyError as error:
                    # If it can't, add to invalid_rows DataFrame
                    row['error'] = error
                    invalid_rows = pd.concat([invalid_rows, row], axis=1)


            if not invalid_rows.empty:
                invalid_rows = invalid_rows.T

                print("Invalid Rows for:")
                for index, row in invalid_rows.iterrows():
                    print(f"{index}: {row['error']}")
                
                raise ValueError("There are invalid sector, industry groups and/or industries found. "
                                 "Please check if it adheres to compression/categories/categories.json")
