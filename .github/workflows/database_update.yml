name: Database Update

on:
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 12 * * SUN'
  workflow_dispatch:  # run by hand from the Actions tab

# One update at a time; a queued run waits instead of racing the running one.
concurrency:
  group: database-update
  cancel-in-progress: false

jobs:
  Add-New-Ticker:
    runs-on: ubuntu-latest
    steps:
      # Pushes to main go through the FinanceDatabase Actions GitHub App, which is on the
      # branch-protection bypass list (the built-in GITHUB_TOKEN cannot bypass it).
      # The App ID may be a repository variable or secret; the private key must be a secret.
      - name: create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FINANCE_DATABASE_ACTIONS_ID || secrets.FINANCE_DATABASE_ACTIONS_ID }}
          private-key: ${{ secrets.FINANCE_DATABASE_ACTIONS_PRIVATE_KEY }}
      - name: checkout repo content
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: pull changes
        run: git pull origin main
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pandas financedatabase
      - name: Add New Tickers and Update Old Ones
        uses: jannekem/run-python-script-action@v1.8
        with:
          script: |
            import glob
            import os
            import numpy as np
            import pandas as pd
            from typing import Optional

            # Market cap thresholds in USD
            MARKET_CAP_THRESHOLDS = {
                'Mega Cap':  200_000_000_000,
                'Large Cap':  10_000_000_000,
                'Mid Cap':    2_000_000_000,
                'Small Cap':    300_000_000,
                'Micro Cap':     50_000_000,
                'Nano Cap':               0,
            }

            def calculate_market_cap(value: Optional[float]) -> Optional[str]:
                """Categorize a market capitalization value into a named tier.
                
                Args:
                    value: Market capitalization in USD, or None/NaN.
                
                Returns:
                    Market cap tier label, or np.nan if value is missing/zero.
                """
                if pd.isna(value) or not value:
                    return np.nan
                for label, threshold in MARKET_CAP_THRESHOLDS.items():
                    if float(value) >= threshold:
                        return label
                return np.nan


            def lookup_industry(row_industry: str, fd_industries: dict) -> Optional[str]:
                """Map an exchange industry label to the FinanceDatabase (GICS) industry.

                Args:
                    row_industry: Raw industry string from the exchange data.
                    fd_industries: Feed industry label -> FinanceDatabase industry.

                Returns:
                    Mapped industry string, or np.nan for a missing or unmapped label.
                """
                return fd_industries.get(row_industry, np.nan)


            def lookup_industry_group(industry: str, equities: pd.DataFrame) -> Optional[str]:
                """Infer the most common industry group for a given industry.

                Args:
                    industry: FinanceDatabase industry string.
                    equities: The equities reference DataFrame.

                Returns:
                    Most frequent industry_group value, or np.nan if not found.
                """
                if pd.isna(industry):
                    return np.nan
                subset = equities[equities['industry'] == industry]
                return subset['industry_group'].mode()[0] if not subset.empty else np.nan


            def lookup_sector(industry: str, industry_group: str, equities: pd.DataFrame) -> Optional[str]:
                """Infer the most common sector for a given industry and industry group.

                Args:
                    industry: FinanceDatabase industry string.
                    industry_group: FinanceDatabase industry_group string.
                    equities: The equities reference DataFrame.

                Returns:
                    Most frequent sector value, or np.nan if not found.
                """
                if pd.isna(industry) or pd.isna(industry_group):
                    return np.nan
                subset = equities[
                    (equities['industry_group'] == industry_group) &
                    (equities['industry'] == industry)
                ]
                return subset['sector'].mode()[0] if not subset.empty else np.nan


            def build_new_ticker(
                index: str,
                row: pd.Series,
                fd_industries: dict,
                equities: pd.DataFrame,
                market_cap: Optional[str],
                exchange_to_mic: dict,
            ) -> dict:
                """Build a new ticker entry for the equities database.

                Args:
                    index: Ticker symbol.
                    row: Raw row from the exchange data.
                    fd_industries: Feed industry label -> FinanceDatabase industry.
                    equities: The equities reference DataFrame.
                    market_cap: Pre-calculated market cap tier.

                Returns:
                    Dictionary with all required equity fields.
                """
                industry = lookup_industry(row['industry'], fd_industries)
                industry_group = lookup_industry_group(industry, equities)
                sector = lookup_sector(industry, industry_group, equities)

                return {
                    'name':            row['name'],
                    'summary':         np.nan,
                    'currency':        'USD',
                    'industry':        industry,
                    'industry_group':  industry_group,
                    'sector':          sector,
                    'exchange':        row['exchange'],
                    'mic':             exchange_to_mic.get(row['exchange'], np.nan),
                    'market':          row['market'],
                    'country':         row['country'],
                    'state':           np.nan,
                    'city':            np.nan,
                    'zipcode':         np.nan,
                    'website':         np.nan,
                    'market_cap':      market_cap,
                    'isin':            np.nan,
                    'cusip':           np.nan,
                    'figi':            np.nan,
                    'composite_figi':  np.nan,
                    'shareclass_figi': np.nan,
                    'delisted':      False,
                }


            # ---------------------------------------------------------------------------
            # Data ingestion
            # ---------------------------------------------------------------------------

            FEED_URL = "https://raw.githubusercontent.com/rreichel3/US-Stock-Symbols/main/{0}/{0}_full_tickers.json"

            # Feed -> (FinanceDatabase exchange file, market label). NYSE listings
            # belong in NYQ (XNYS); only NYSE American (formerly AMEX) is ASE (XASE).
            FEEDS = {
                'nasdaq': ('NMS', 'NASDAQ Global Select'),
                'nyse':   ('NYQ', 'New York Stock Exchange'),
                'amex':   ('ASE', 'NYSE American'),
            }

            # A plain ticker: letters/digits plus the class and series separators
            # used in these feeds (BRK/A, ABR^D, BF.B). Anything else, including
            # whitespace-padded symbols like "ECC           ", is rejected.
            VALID_SYMBOL = r'^[A-Z0-9]+(?:[./^-][A-Z0-9]+)*$'

            # Exchange-traded products belong in database/etfs, not equities.
            ETP_NAME = r'\b(?:ETF|ETFs|ETN|ETNs|Exchange[- ]Traded)\b'

            # Instruments with an expiry or maturity date (warrants, rights, notes and
            # bonds due in a given year) go out of date quickly and are not added.
            DATED_NAME = (
                r'\bwarrants?\b|\s(?:WTS?|RTS)$|\brights?$|\bsubscription rights?\b'
                r'|\bcontingent value rights?\b|\brights? to (?:receive|subscribe)\b'
                r'|\b(?:notes?|debentures?|bonds?|preferred shares)\b.*\bdue\b'
                r'|\bdue\s+(?:\w+\s+)?(?:\d{1,2},?\s+)?(?:19|20)\d\d\b'
                r'|\b(?:perpetual|subordinated|senior)\s+(?:\w+\s+)?(?:notes?|debentures?|bonds?)\b'
                r'|\b(?:notes?|debentures?)\s*$|\bincome capital obligation'
                r'|\bexpir(?:es|ing|ation)\b|\b\d{1,2}/\d{1,2}/(?:19|20)?\d{2}\b'
            )


            def load_feed(name: str) -> Optional[pd.DataFrame]:
                """Download one exchange feed and drop rows that would become junk.

                A blocked, unreachable, truncated or reformatted feed is skipped (None) so it
                can never add junk or fail the weekly pipeline; the other feeds still run.
                """
                try:
                    feed = pd.read_json(FEED_URL.format(name), dtype=False)
                except Exception as error:
                    print(f"{name}: feed skipped ({type(error).__name__}: {error})")
                    return None
                if len(feed) < 100 or not {'symbol', 'name'} <= set(feed.columns):
                    print(f"{name}: feed skipped, it looks broken ({len(feed)} rows)")
                    return None
                # The feeds write share classes as BRK/A; the database uses BRK-A, so
                # normalise them to match existing rows instead of adding duplicates.
                feed['symbol'] = feed['symbol'].astype(str).str.strip().str.replace('/', '-', regex=False)
                feed['name'] = feed['name'].astype(str).str.strip()
                invalid = ~feed['symbol'].str.match(VALID_SYMBOL)
                etp = feed['name'].str.contains(ETP_NAME, case=False, regex=True)
                dated = feed['name'].str.contains(DATED_NAME, case=False, regex=True)
                if invalid.any():
                    print(f"{name}: skipping malformed symbols {feed.loc[invalid, 'symbol'].tolist()}")
                if etp.any():
                    print(f"{name}: skipping exchange-traded products {feed.loc[etp & ~invalid, 'symbol'].tolist()}")
                if dated.any():
                    print(f"{name}: skipping warrants, rights and dated notes {feed.loc[dated & ~invalid & ~etp, 'symbol'].tolist()}")
                feed = feed[~invalid & ~etp & ~dated & (feed['name'] != '')]
                feed = feed.drop_duplicates('symbol').set_index('symbol')
                feed['exchange'], feed['market'] = FEEDS[name]
                return feed


            # Combine all exchange datasets; a symbol is listed on one exchange only.
            feeds = [feed for feed in (load_feed(name) for name in FEEDS) if feed is not None]
            exchange_data = pd.concat(feeds) if feeds else pd.DataFrame()
            exchange_data = exchange_data[~exchange_data.index.duplicated(keep='first')]

            # ---------------------------------------------------------------------------
            # Reference data
            # ---------------------------------------------------------------------------

            # Nasdaq feed industry label -> GICS industry. Labels that span several GICS
            # industries are not listed, so those tickers stay unclassified.
            fd_industries = (
                pd.read_csv('scripts/us_feed_industries.csv', dtype=str, keep_default_na=False)
                .set_index('feed_industry')['industry']
                .to_dict()
            )

            # Read the equities database from per-exchange files, preserving every
            # cell exactly as written so the rewrite below is a no-op for untouched
            # rows. dtype=str stops pandas inferring numeric-looking columns such as
            # zipcode and cusip as float64 ("9763" -> "9763.0", "031162100" ->
            # "31162100.0"). keep_default_na=False stops it reading the symbol "NA"
            # (Nano Labs) as a missing value, which dropped that row on every run.
            # Missing cells are therefore empty strings, not NaN, from here on.
            equities = pd.concat(
                [pd.read_csv(f, index_col=0, dtype=str, keep_default_na=False)
                 for f in sorted(glob.glob('database/equities/*.csv'))],
            )

            # Derive the exchange -> ISO 10383 MIC map from the existing
            # (ISO-validated, one-to-one) data; unknown codes stay blank.
            exchange_to_mic = (
                equities[equities['mic'] != '']
                .drop_duplicates('exchange')
                .set_index('exchange')['mic']
                .to_dict()
            )

            # A symbol may belong to one asset class only: never add a ticker as an
            # equity when it already exists as an ETF, fund, index, currency, etc.
            other_asset_symbols = set()
            for asset in ['etfs', 'funds']:
                for f in glob.glob(f'database/{asset}/*.csv'):
                    other_asset_symbols |= set(pd.read_csv(f, usecols=[0], dtype=str, keep_default_na=False).iloc[:, 0])
            for asset in ['indices', 'currencies', 'cryptos', 'moneymarkets']:
                other_asset_symbols |= set(pd.read_csv(f'database/{asset}.csv', usecols=[0], dtype=str, keep_default_na=False).iloc[:, 0])

            # ---------------------------------------------------------------------------
            # Main processing loop
            # ---------------------------------------------------------------------------

            ticker_dict: dict = {}

            for index, row in exchange_data.iterrows():
                market_cap = calculate_market_cap(pd.to_numeric(row.get('marketCap'), errors='coerce'))

                if index in equities.index:
                    fd_data = equities.loc[index]
                    if isinstance(fd_data, pd.DataFrame):
                        fd_data = fd_data.iloc[0]

                    # Update market_cap only when it has changed and the new value is valid
                    if pd.notna(market_cap) and fd_data['market_cap'] != market_cap:
                        ticker_dict[index] = {**fd_data.to_dict(), 'market_cap': market_cap}
                elif index not in other_asset_symbols:
                    ticker_dict[index] = build_new_ticker(index, row, fd_industries, equities, market_cap, exchange_to_mic)

            # ---------------------------------------------------------------------------
            # Merge results back into equities
            # ---------------------------------------------------------------------------

            updated_companies = pd.DataFrame.from_dict(ticker_dict, orient='index')
            updated_companies.index.name = 'symbol'

            # Drop accidental 'symbol' column that may surface from existing-row updates
            updated_companies = updated_companies.drop(columns=['symbol'], errors='ignore')

            print(f"There are {len(updated_companies)} new updates!")

            if not updated_companies.empty:
                # Update existing rows in-place
                existing_indices = updated_companies.index.intersection(equities.index)
                if not existing_indices.empty:
                    equities.update(updated_companies.loc[existing_indices])

                # Append completely new tickers
                new_indices = updated_companies.index.difference(equities.index)
                if not new_indices.empty:
                    equities = pd.concat([equities, updated_companies.loc[new_indices]])
                    
                equities = equities[~equities.index.duplicated(keep='first')]

                # Drop entries with no symbol at all. Existing rows carry an empty
                # string here; rows appended above may still carry NaN.
                equities = equities[equities.index.notna() & (equities.index != '')]
                equities = equities.sort_index()

                for f in glob.glob('database/equities/*.csv'):
                    os.remove(f)
                # Rows without an exchange cannot be routed to a per-exchange file.
                unknown_exchange = equities['exchange'].isna() | (equities['exchange'] == '')
                for exchange, group in equities[~unknown_exchange].groupby('exchange'):
                    group.to_csv(f'database/equities/{exchange}.csv')
                if unknown_exchange.any():
                    equities[unknown_exchange].to_csv('database/equities/NAN.csv')
      # New equities and ETFs from the official HKEX, NSE, JPX, ASX, TSX/TSXV and Nasdaq Trader
      # symbol directories, enriched via OpenFIGI and SEC EDGAR. Each source is isolated: a blocked, failing
      # or changed source is skipped and logged. This step can never fail the pipeline: the
      # script exits cleanly on any error, and continue-on-error / timeout-minutes make sure
      # the US update above is still committed and the compression jobs still run.
      # OPENFIGI_API_KEY is optional (higher OpenFIGI rate limits); it works without it.
      # See scripts/update_listings.py for the rules.
      - name: Add Listings from Exchange Symbol Directories
        continue-on-error: true
        timeout-minutes: 45
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          # Contact SEC EDGAR requires for automated access (repository variable). Without it,
          # US ETFs are added without SEC objectives / registrant-based families.
          SEC_USER_AGENT_EMAIL: ${{ vars.SEC_USER_AGENT_EMAIL }}
        run: python scripts/update_listings.py
      - name: Commit files and log
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add -A
          git checkout main
          git diff-index --quiet HEAD || git commit -am "Update database with new tickers [skip ci]"
          git push
      - name: Check run status
        if: steps.run.outputs.status != '0'
        run: exit "${{ steps.run.outputs.status }}"

  Update-Compression-Files:
    needs: Add-New-Ticker
    runs-on: ubuntu-latest
    steps:
      # Pushes to main go through the FinanceDatabase Actions GitHub App, which is on the
      # branch-protection bypass list (the built-in GITHUB_TOKEN cannot bypass it).
      # The App ID may be a repository variable or secret; the private key must be a secret.
      - name: create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FINANCE_DATABASE_ACTIONS_ID || secrets.FINANCE_DATABASE_ACTIONS_ID }}
          private-key: ${{ secrets.FINANCE_DATABASE_ACTIONS_PRIVATE_KEY }}
      - name: checkout repo content
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: pull changes
        run: git pull origin main
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install polars
      - name: Update Compressions
        # Polars writes the bz2 CSVs every package version reads, and a typed Parquet
        # file per asset class for the versions that read Parquet.
        run: python scripts/update_compression.py --only datasets
      - name: Commit files and log
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add -A
          git checkout main
          git diff-index --quiet HEAD || git commit -am "Update Compression Files [skip ci]"
          git push

  Update-Categorization-Files:
      needs:  [Add-New-Ticker, Update-Compression-Files]
      runs-on: ubuntu-latest
      steps:
        # Pushes to main go through the FinanceDatabase Actions GitHub App, which is on the
        # branch-protection bypass list (the built-in GITHUB_TOKEN cannot bypass it).
        # The App ID may be a repository variable or secret; the private key must be a secret.
      # The App ID may be a repository variable or secret; the private key must be a secret.
        - name: create app token
          id: app-token
          uses: actions/create-github-app-token@v2
          with:
            app-id: ${{ vars.FINANCE_DATABASE_ACTIONS_ID || secrets.FINANCE_DATABASE_ACTIONS_ID }}
            private-key: ${{ secrets.FINANCE_DATABASE_ACTIONS_PRIVATE_KEY }}
        - name: checkout repo content
          uses: actions/checkout@v6
          with:
            token: ${{ steps.app-token.outputs.token }}
        - name: pull changes
          run: git pull origin main
        - name: setup python
          uses: actions/setup-python@v6
          with:
            python-version: '3.11'
        - run: pip install polars
        - name: Update categories
          # The gzip CSV layout every package version reads, plus a Parquet file with
          # one list of values per category.
          run: python scripts/update_compression.py --only categories

        - name: Commit files and log
          run: |
            git config --global user.name 'GitHub Action'
            git config --global user.email 'action@github.com'
            git add -A
            git checkout main
            git diff-index --quiet HEAD || git commit -am "Update Categorization Files [skip ci]"
            git push

  Update-README-Statistics:
    needs: [Add-New-Ticker, Update-Compression-Files, Update-Categorization-Files]
    runs-on: ubuntu-latest
    steps:
      # Pushes to main go through the FinanceDatabase Actions GitHub App, which is on the
      # branch-protection bypass list (the built-in GITHUB_TOKEN cannot bypass it).
      # The App ID may be a repository variable or secret; the private key must be a secret.
      - name: create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.FINANCE_DATABASE_ACTIONS_ID || secrets.FINANCE_DATABASE_ACTIONS_ID }}
          private-key: ${{ secrets.FINANCE_DATABASE_ACTIONS_PRIVATE_KEY }}
      - name: checkout repo content
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: pull changes
        run: git pull origin main
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pandas
      # Regenerates the statistics section between the STATISTICS markers in README.md
      # (the overview table). Never fails the pipeline.
      - name: Refresh the statistics section in README.md
        run: python scripts/update_readme_stats.py
      - name: Commit README update
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add README.md
          git diff-index --quiet HEAD || git commit -m "Update README statistics [skip ci]"
          git push

  Check-GICS-Categorisation:
    needs:  [Add-New-Ticker, Update-Compression-Files, Update-Categorization-Files, Update-README-Statistics]
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v6
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pandas financedatabase
      - name: Check GICS Categorisation
        uses: jannekem/run-python-script-action@v1.8
        with:
          script: |
            import glob
            import pandas as pd
            import json

            invalid_rows = pd.DataFrame()
            errors = []
            gics = json.load(open("compression/categories/categories.json", "r"))
            equities = pd.concat([pd.read_csv(f, index_col=0) for f in sorted(glob.glob('database/equities/*.csv'))])
            filtered_data = equities[equities['sector'].notna() & equities['industry_group'].notna() & equities['industry'].notna()]

            for index, row in filtered_data.iterrows():
                sector, industry_group, industry = row['sector'], row['industry_group'], row['industry']

                try:
                    # Search whether it can find the combination
                    gics[sector][industry_group][industry]
                except KeyError as error:
                    # If it can't, add to invalid_rows DataFrame
                    row['error'] = error
                    invalid_rows = pd.concat([invalid_rows, row], axis=1)


            if not invalid_rows.empty:
                invalid_rows = invalid_rows.T

                print("Invalid Rows for:")
                for index, row in invalid_rows.iterrows():
                    print(f"{index}: {row['error']}")
                
                raise ValueError("There are invalid sector, industry groups and/or industries found. "
                                 "Please check if it adheres to compression/categories/categories.json")
